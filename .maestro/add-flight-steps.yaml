# Add-flight steps as pushed screens: the flow lives in the Flights stack,
# one screen per step (flight number → date → details), each with the stack's
# header and back chevron and no tab bar. Walks forward through the manual
# path and back out to Flights, checking each step's title on the way.
# Back is a left-edge swipe on iOS (Maestro's `back` presses Home there) and
# the system back on Android. Nothing is saved.
# Run: maestro test .maestro/add-flight-steps.yaml   (booted device with the
# dev build installed and `npx expo start` serving :8081)
appId: com.shanavasshaji.flyright
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- openLink: "flyright://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 20000
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
# Onboarding shows on a fresh install; a signed-in dev client may skip it.
- extendedWaitUntil:
    visible: "Skip"
    timeout: 90000
    optional: true
- tapOn:
    text: "Skip"
    optional: true
# The ATT prompt can also follow onboarding (see layers-analytics); an alert
# hides the whole hierarchy from Maestro, so clear it before going on.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 15000
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
- extendedWaitUntil:
    visible: "Flights"
    timeout: 30000
- openLink: flyright://add-flight
- extendedWaitUntil:
    visible: "Add Flight"
    timeout: 30000
- assertVisible:
    id: "add-manually"
# The tab bar steps aside for the flow.
- assertNotVisible: "World"
- tapOn:
    id: "add-manually"
- extendedWaitUntil:
    visible: "Departure date"
    timeout: 10000
- assertVisible: "Yesterday.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 45%
          end: 95%, 45%
          duration: 400
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: "Add Flight"
    timeout: 10000
- assertVisible:
    id: "add-manually"
- tapOn:
    id: "add-manually"
- extendedWaitUntil:
    visible: "Yesterday.*"
    timeout: 10000
- tapOn: "Yesterday.*"
- extendedWaitUntil:
    visible: "Trip details"
    timeout: 10000
- assertVisible: "From · city or HEL"
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 45%
          end: 95%, 45%
          duration: 400
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: "Departure date"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 45%
          end: 95%, 45%
          duration: 400
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: "Add Flight"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 45%
          end: 95%, 45%
          duration: 400
- runFlow:
    when:
      platform: Android
    commands:
      - back
# Out of the flow: the journal's own title, with the tab bar back.
- extendedWaitUntil:
    visible: "Add a flight, past or future"
    timeout: 10000
- assertVisible: "World"
