# Add-flight flow: "+" entry → flight number → date → track → verdict.
# Uses the dev mock in /api/flight-status (no AERODATABOX_API_KEY set): an odd
# flight number on a past date arrives 195 min late → EU261-eligible.
# Note: pressable rows flatten their children into one accessibility label on
# iOS, so row selectors are .*…* regexes over the combined label.
# Run: maestro test .maestro/add-flight.yaml   (requires a booted simulator with
# the dev build installed and `npx expo start` serving the bundle on :8081)
appId: com.shanavasshaji.flyright
---
- launchApp:
    clearState: true # deterministic: the journeys DB starts empty
    permissions:
      notifications: allow # keep the post-track permission prompt out of the flow
- openLink: "flyright://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
# First launch also raises the ATT prompt (simctl can't pre-grant it); clear
# it when it shows so it doesn't sit over onboarding.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 20000
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
# clearState makes this a first launch, so the onboarding intro shows first.
# clearState also wipes the dev client's cached bundle — the first Metro
# download can sit on a splash well past 30s (same as the travel-day flows).
- extendedWaitUntil:
    visible: "Skip"
    timeout: 90000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "My travels"
    timeout: 30000
- tapOn: "Add a flight, past or future"
- extendedWaitUntil:
    visible: "Add Flight"
    timeout: 10000
- tapOn: "AY1331 or LH873"
- inputText: "AY1331"
- extendedWaitUntil:
    visible: ".*Search this flight.*"
    timeout: 5000
- tapOn: ".*Search this flight.*"
- extendedWaitUntil:
    visible: ".*Yesterday.*"
    timeout: 5000
- tapOn: ".*Yesterday.*"
- extendedWaitUntil:
    visible: ".*Save to My travels.*"
    timeout: 15000
- assertVisible: ".*HEL → .*"
- tapOn: ".*Save to My travels.*"
# The "Added to My travels" confirmation auto-dismisses in 1.2s — faster than
# iOS hierarchy polling — so the journeys row below is the success assertion.
- extendedWaitUntil:
    visible: "My travels"
    timeout: 10000
- assertVisible: ".*AY1331.*"
- tapOn: ".*AY1331.*"
# Mock data (odd number, past date) yields the owed verdict; a live API key
# returns the real flight, which is usually on time — a landed on-time flight
# gets the "No compensation due" card, so accept any of the three.
- extendedWaitUntil:
    visible: "(You're owed|We're watching this flight|No compensation due).*"
    timeout: 15000
