# Change-plan navigation, UI taps only (no deep links): Settings tab →
# Manage subscription (Customer Center on a pushed route) → 'Change plan'
# custom action → paywall opens immediately. On the free plan (test
# subscriptions expire on their own) the path is Settings → Get Owed Pro.
# The dev client auto-loads the last bundle on plain launch.
appId: com.sshanavas.owed
---
- launchApp
- extendedWaitUntil:
    visible: "Journeys"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Restore purchases"
    timeout: 10000
- runFlow:
    when:
      visible: "Manage subscription"
    commands:
      - tapOn: "Manage subscription"
      - extendedWaitUntil:
          visible: "Change plan"
          timeout: 15000
      - tapOn: "Change plan"
- runFlow:
    when:
      visible: "Get Owed Pro"
    commands:
      - tapOn: "Get Owed Pro"
- extendedWaitUntil:
    visible: "Monthly"
    timeout: 15000
- assertVisible: "Yearly"
- assertVisible: "Lifetime"
- assertVisible: "Restore purchases"
