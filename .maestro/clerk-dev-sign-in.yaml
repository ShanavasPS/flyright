# Sign a Clerk DEV test user in through the app's sign-in sheet. Expects the
# sheet to be open already (tap any "Sign in…" button first) and a user whose
# address contains +clerk_test — the emailed OTP is then always 424242.
# Run: maestro --device <udid> test .maestro/clerk-dev-sign-in.yaml -e EMAIL=anna+clerk_test@example.com
# Verified on iOS 26 (2026-09-03). On the Android emulator Maestro's inputText
# stalls in Clerk's field — type with `adb shell input text` instead.
# Clerk prefills the field with the "Last used" address once anyone has
# signed in on the device; typing on top of it makes an invalid identifier
# (a@b.coma@b.com), so the field is cleared first.
# EMAIL has NO default on purpose: a flow-level `env:` beats both `-e` on the
# command line and a caller's `runFlow: env:`, so the helper would always sign
# sam in. Callers pass it with `runFlow: { file: clerk-dev-sign-in.yaml, env: { EMAIL: … } }`.
appId: com.shanavasshaji.flyright
tags:
  - helper
---
- extendedWaitUntil:
    visible: "Enter your email"
    timeout: 20000
- tapOn: "Enter your email"
- eraseText: 100
- inputText: ${EMAIL}
# Some iOS 27 simulators report shifted SwiftUI bounds with the keyboard up.
# A verified screenshot coordinate can be supplied as IOS_EMAIL_CONTINUE_POINT
# for that simulator. Other targets keep the native accessibility identifier.
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            true: ${typeof IOS_EMAIL_CONTINUE_POINT !== 'undefined'}
          commands:
            - tapOn:
                point: ${IOS_EMAIL_CONTINUE_POINT}
            - extendedWaitUntil:
                visible: ".*Check your email.*"
                timeout: 3000
                optional: true
            # The first tap can only settle the field's edit. Retry only if
            # the same email form remains; the OTP assertion below is required.
            - runFlow:
                when:
                  visible:
                    id: "clerk.auth.start.continue"
                commands:
                  - tapOn:
                      point: ${IOS_EMAIL_CONTINUE_POINT}
      - runFlow:
          when:
            true: ${typeof IOS_EMAIL_CONTINUE_POINT === 'undefined'}
          commands:
            - tapOn:
                id: "clerk.auth.start.continue"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: ".*Check your email.*"
    timeout: 20000
- inputText: "424242"
