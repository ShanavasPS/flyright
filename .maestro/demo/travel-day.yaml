# Demo scene 04 — Travel Day Live: the live hero (running light, countdown,
# gate), open the timeline, tap the next step, send the app to the background
# so the Dynamic Island shows the activity in its compact pill,
# then lock the phone for the Lock Screen card, and unlock.
# Seed: node scripts/seed-demo-data.mjs --ios --sim <udid> --travel-day
# Run travel-day-allow.yaml once before recording (first Live Activity start
# asks for permission on the Lock Screen).
appId: com.shanavasshaji.flyright
tags:
  - demo
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "travel-day-banner"
    timeout: 60000
- extendedWaitUntil:
    visible: "demo-pause-never-matches"
    timeout: 2500
    optional: true
- tapOn:
    id: "travel-day-banner"
# The first tap occasionally lands on the running-light animation and does
# nothing — one retry if the trip page hasn't opened.
- extendedWaitUntil:
    visible: "Travel day"
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible: "Travel day"
    commands:
      - tapOn:
          id: "travel-day-banner"
- extendedWaitUntil:
    visible: "Travel day"
    timeout: 20000
- extendedWaitUntil:
    visible: "demo-pause-never-matches"
    timeout: 1200
    optional: true
# The next step's action row (seeded through security → passport control).
# Exact text, not optional: an optional miss waits out Maestro's whole
# element timeout and pads the footage.
- tapOn: "I'm through immigration"
- extendedWaitUntil:
    visible: "demo-pause-never-matches"
    timeout: 900
    optional: true
# Home → the Dynamic Island carries the activity in its compact form.
# (A long-press would expand the island, but Maestro's press latency here
# runs 10+ s and blows the two-minute budget — the compact pill is the shot.)
- pressKey: Home
- extendedWaitUntil:
    visible: "demo-pause-never-matches"
    timeout: 2600
    optional: true
- pressKey: Lock
- extendedWaitUntil:
    visible: "demo-pause-never-matches"
    timeout: 2600
    optional: true
- pressKey: Home
- pressKey: Home
