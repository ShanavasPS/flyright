# Galaxy Store build variant check: the billing-free Samsung build hides all
# Pro upsell UI (settings rows) because RevenueCat has no Samsung IAP.
#
# ONLY passes against a `galaxy`-profile build (eas build -p android --profile
# galaxy → APK with EXPO_PUBLIC_STORE_VARIANT=galaxy). On Play/dev builds the
# "Get FlyRight Pro" row IS visible and this flow fails by design.
# Run: maestro test .maestro/galaxy-variant.yaml  (install the galaxy APK first)
appId: com.shanavasshaji.flyright
---
- launchApp:
    clearState: true
# First launch also raises the ATT prompt (simctl can't pre-grant it); clear
# it when it shows so it doesn't sit over onboarding.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 20000
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
- extendedWaitUntil:
    visible: "Every flight, remembered"
    timeout: 30000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "My travels"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 10000
- assertNotVisible: "Get FlyRight Pro"
- assertNotVisible: "Restore purchases"
- assertNotVisible: "FlyRight Pro"
