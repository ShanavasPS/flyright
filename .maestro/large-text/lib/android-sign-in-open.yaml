# Opens Clerk's email field on Android. The runner types with adb, because
# Maestro's inputText stalls in Clerk's fields on the emulator.
appId: com.shanavasshaji.flyright
tags:
  - helper
---
- launchApp
# Android drops a link sent before the router is up: wait for the tab bar.
- extendedWaitUntil:
    visible: "Flights"
    timeout: 30000
    optional: true
- openLink: "flyright://settings"
- extendedWaitUntil:
    visible: ".*(Sign in or create account|clerk_test).*"
    timeout: 30000
- tapOn: "Sign in or create account"
- extendedWaitUntil:
    visible: ".*(Enter your email|Email address).*"
    timeout: 20000
- tapOn: ".*(Enter your email|Email address).*"
