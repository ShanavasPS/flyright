# Manual add-flight airline picker: the "Airline" chip opens a sheet with the
# search pinned to the top and the matches directly under it, so they can't
# land under the keyboard. The search forgives doubled letters ("carribbean")
# and a pick closes the sheet and lands on the trip card. Rows carry the test
# ID airline-<IATA>. No hideKeyboard on the way: on Android it is a back press
# and closes the whole screen.
# Run: maestro test .maestro/manual-airline-sheet.yaml   (booted device with
# the dev build installed and `npx expo start` serving :8081)
appId: com.shanavasshaji.flyright
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- openLink: "flyright://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 20000
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
# Onboarding shows on a fresh install; a signed-in dev client may skip it.
- extendedWaitUntil:
    visible: "Skip"
    timeout: 90000
    optional: true
- tapOn:
    text: "Skip"
    optional: true
# The ATT prompt can also follow onboarding (see layers-analytics); an alert
# hides the whole hierarchy from Maestro, so clear it before going on.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Allow"
          timeout: 15000
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
- extendedWaitUntil:
    visible: "Flights"
    timeout: 30000
- openLink: flyright://add-flight
- extendedWaitUntil:
    visible:
      id: "add-manually"
    timeout: 30000
- tapOn:
    id: "add-manually"
- extendedWaitUntil:
    visible: "Yesterday.*"
    timeout: 10000
- tapOn: "Yesterday.*"
- extendedWaitUntil:
    visible: "From · city or HEL"
    timeout: 10000
- inputText: "HEL"
- tapOn: ".*Helsinki.*"
- inputText: "POS"
- tapOn: ".*Port of Spain.*"
- scrollUntilVisible:
    element:
      id: "manual-airline"
    direction: DOWN
- tapOn:
    id: "manual-airline"
- extendedWaitUntil:
    visible: "Choose an airline"
    timeout: 10000
# Browsable before anything is typed.
- assertVisible:
    id: "airline-A3"
- inputText: "carribbean"
- assertVisible:
    id: "airline-BW"
- assertVisible:
    id: "airline-JY"
- assertNotVisible:
    id: "airline-A3"
- tapOn:
    id: "airline-BW"
# iOS folds the chip into one label ("Airline Caribbean Airlines. Change").
- extendedWaitUntil:
    visible: ".*Caribbean Airlines.*"
    timeout: 10000
- assertNotVisible: "Choose an airline"
