# A followed person's page: who they are, where they're going, where they've
# been — and the two decisions a follower actually owns. Replaces the action
# sheet a row used to open, which could answer neither "where are they going"
# nor "how do I see that trip".
#
# Prereqs: signed in, following somebody with at least one upcoming and one
# flown trip. Seed the other side through the real sync path so the
# "added a trip" push is exercised too:
#   npx convex run journeys:push '{"rows":[…]}' --identity '{"subject":"user_dev_sam"}'
# Run: maestro --device <udid> test .maestro/person-profile.yaml -e WHO=Sam -e FLIGHT=BA777
appId: com.shanavasshaji.flyright
tags:
  - people
---
- launchApp
- openLink: flyright://people
# The row carries the person AND their next flight, so match loosely.
- extendedWaitUntil:
    visible: ".*${WHO}.*"
    timeout: 40000
- tapOn: ".*${WHO}.*"

# The profile: summary, then travel in both directions of time.
- extendedWaitUntil:
    visible: "UPCOMING"
    timeout: 30000
- assertVisible: ".*Sharing their trips with you since.*"
- assertVisible: "Trips ahead"
- assertVisible: "FLOWN"

# Their travel, drawn — and the same map the World tab uses, full screen,
# on the person and never as a mode of the viewer's own World tab.
- tapOn: "${WHO}'s world"
- extendedWaitUntil:
    visible: ".*${WHO}'s world.*"
    timeout: 30000
- assertVisible: "countries"
- tapOn: "Back"

# A trip opens read-only: nothing on it changes the trip. Its map is the one
# exception, and it opens their world on that leg — with "All travels" there
# to widen out to everything, exactly as the World tab does for your own.
- extendedWaitUntil:
    visible: "UPCOMING"
    timeout: 20000
- tapOn: ".*${FLIGHT}.*"
- extendedWaitUntil:
    visible: ".*Only ${WHO} can change this trip.*"
    timeout: 30000
- assertVisible: "DEPARTS"
- assertVisible: "ARRIVES"
- tapOn:
    text: ".*Map of.*"
- extendedWaitUntil:
    visible: ".*${FLIGHT}.*"
    timeout: 30000
# The label is the accessibility one; the pill reads "All travels".
- tapOn: "Show all travels"
- extendedWaitUntil:
    visible: ".*${WHO}'s world.*"
    timeout: 20000
- tapOn: "Back"

# Back unwinds trip → person → People, which is the order a notification
# opening straight on a trip has to be able to walk out of.
# `back` is the swipe gesture on iOS and does not always take; the header
# button is the reliable one. Each is named for the screen it returns TO,
# so the trip's says the person's name and the person's says People.
- tapOn: "${WHO}"
- extendedWaitUntil:
    visible: "UPCOMING"
    timeout: 20000
# The person screen's back button is named for the list it returns to, so
# it collides with the tab of the same name — the header one comes first.
- tapOn:
    text: "People"
    index: 0
- extendedWaitUntil:
    visible: "SHARING WITH"
    timeout: 20000

# The only two things a follower may do, at the bottom where they belong.
- tapOn: ".*${WHO}.*"
- extendedWaitUntil:
    visible: "UPCOMING"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ".*Mute updates.*"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ".*Stop following.*"
    direction: DOWN
    timeout: 20000

# The bar steps aside for the full-bleed map and comes straight back. It is
# the only screen it hides for — Apple's guidance is to keep a tab bar up
# while people move around an app, and a stuck-hidden bar is the failure
# this asserts against.
# The controls left us at the foot of the page; the map card is at its head.
- scrollUntilVisible:
    element:
      text: "${WHO}'s world"
    direction: UP
    timeout: 20000
- tapOn: "${WHO}'s world"
- extendedWaitUntil:
    visible: ".*${WHO}'s world.*"
    timeout: 30000
- assertNotVisible: "Tab Bar"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "UPCOMING"
    timeout: 20000
- assertVisible: "Tab Bar"
