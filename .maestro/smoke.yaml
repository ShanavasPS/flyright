# Smoke test: dev-client build boots, JS bundle loads, home screen renders.
# Run: maestro test .maestro/smoke.yaml   (requires a booted simulator with the
# dev build installed and `npx expo start` serving the bundle on :8081)
appId: com.shanavasshaji.flyright
---
- launchApp:
    clearState: true # deterministic: the journeys DB starts empty
- openLink: "flyright://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
# A cleared state means a first launch, so the onboarding intro covers the
# tabs — its render doubles as the boot check before Skip reveals the journal.
- extendedWaitUntil:
    visible: "Every flight, remembered"
    timeout: 30000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "My travels"
    timeout: 30000
- assertVisible: "Your travel journal"
- tapOn: "Claims"
- extendedWaitUntil:
    visible: "No claims yet"
    timeout: 10000
- assertVisible: "See a demo verdict.*"
