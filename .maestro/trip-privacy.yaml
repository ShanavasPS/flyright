# Trip privacy: the detail's "···" menu offers "Only my close circle", the
# trip-log card then wears a "Close circle only" chip, and the same menu
# offers "Show to your whole circle" to undo it. The server side (members
# outside the close circle losing the trip in People, no pushes, no follow,
# the link showing the traveler instead) is enforced in Convex and needs two
# signed-in users — see convex/journeys.ts push and circle.setClose.
#
# Needs a journal row (see world-map.yaml's recipe) whose id is passed as
# JOURNEY_ID. Works on any trip, flown or upcoming.
#
# Run: maestro --device <device> test -e JOURNEY_ID=seed-2 .maestro/trip-privacy.yaml
appId: com.shanavasshaji.flyright
---
- launchApp
- extendedWaitUntil:
    visible: "My travels"
    timeout: 90000
- openLink: "flyright:///journey/${JOURNEY_ID}"
- extendedWaitUntil:
    visible: "Trip options"
    timeout: 15000
- assertNotVisible: "Close circle only"
- tapOn: "Trip options"
- assertVisible: "Only my close circle"
- tapOn: "Only my close circle"
- extendedWaitUntil:
    visible: "Close circle only"
    timeout: 10000
- takeScreenshot: ${SHOTS}/trip-hidden
- tapOn: "Trip options"
- assertVisible: "Show to your whole circle"
- tapOn: "Show to your whole circle"
- assertNotVisible: "Close circle only"
