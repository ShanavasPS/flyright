# Trip privacy: the detail's "···" menu offers "Hide from your circle", the
# trip-log card then wears a "Hidden from your circle" chip, and the same menu
# offers "Show to your circle" to undo it. The server side (circle members
# losing the trip in People, no pushes, no auto-follow) is enforced in Convex
# and needs two signed-in users — see convex/journeys.ts push.
#
# Needs a journal row (see world-map.yaml's recipe) whose id is passed as
# JOURNEY_ID. Works on any trip, flown or upcoming.
#
# Run: maestro --device <device> test -e JOURNEY_ID=seed-2 .maestro/trip-privacy.yaml
appId: com.shanavasshaji.flyright
---
- launchApp
- extendedWaitUntil:
    visible: "My travels"
    timeout: 90000
- openLink: "flyright:///journey/${JOURNEY_ID}"
- extendedWaitUntil:
    visible: "Trip options"
    timeout: 15000
- assertNotVisible: "Hidden from your circle"
- tapOn: "Trip options"
- assertVisible: "Hide from your circle"
- tapOn: "Hide from your circle"
- extendedWaitUntil:
    visible: "Hidden from your circle"
    timeout: 10000
- takeScreenshot: ${SHOTS}/trip-hidden
- tapOn: "Trip options"
- assertVisible: "Show to your circle"
- tapOn: "Show to your circle"
- assertNotVisible: "Hidden from your circle"
