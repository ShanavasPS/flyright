# World tab globe: the Skia earth that replaced the map. A drag turns it,
# a double tap zooms in about the tapped point (and shows Recenter), and
# Recenter animates back to the fit of the traveller's routes.
#
# PRECONDITION: seeded journeys (recipe in world-map.yaml's header) and the
# dev build served by `npx expo start` on :8081. Pinch can't be synthesized
# by Maestro, so zoom is exercised with the double tap; the pinch is checked
# by hand.
#
# Run: maestro --device <device> test .maestro/world-globe.yaml
appId: com.shanavasshaji.flyright
---
- launchApp
- openLink: "flyright://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "World"
    timeout: 90000
- openLink: "flyright://world"
- extendedWaitUntil:
    visible: "Everywhere you.ve been"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "world-globe"
    timeout: 10000
- takeScreenshot: world-globe-fit
# Turn the globe a quarter of the way round and let it settle.
- swipe:
    start: "70%,50%"
    end: "30%,50%"
    duration: 400
- extendedWaitUntil:
    visible: "Recenter the globe on your travels"
    timeout: 5000
- takeScreenshot: world-globe-turned
- doubleTapOn:
    point: "50%,45%"
- doubleTapOn:
    point: "50%,45%"
- takeScreenshot: world-globe-zoomed
- tapOn: "Recenter the globe on your travels"
- extendedWaitUntil:
    notVisible: "Recenter the globe on your travels"
    timeout: 10000
- takeScreenshot: world-globe-refit
