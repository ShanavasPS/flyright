# Existing journal and running dev app; never clears traveller data.
# Re-selecting All time and revisiting World must both restore the camera.
# Pass SHOTS as an output prefix, e.g. /tmp/flyright-world-android.
appId: com.shanavasshaji.flyright
---
- openLink: "flyright:///world"
- extendedWaitUntil:
    visible: "Showing All time.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    start: "25%,40%"
    end: "65%,55%"
    duration: 600
- extendedWaitUntil:
    visible:
      id: world-map-recenter
    timeout: 10000
- takeScreenshot: ${SHOTS}-zoomed
- tapOn:
    text: "Showing All time.*"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "All time"
    selected: true
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "Close"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: world-map-recenter
    timeout: 10000
- takeScreenshot: ${SHOTS}-all-time-restored
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    start: "25%,40%"
    end: "65%,55%"
    duration: 600
- extendedWaitUntil:
    visible:
      id: world-map-recenter
    timeout: 10000
- openLink: "flyright:///"
- extendedWaitUntil:
    visible: "Flights"
    timeout: 15000
- openLink: "flyright:///world"
- extendedWaitUntil:
    visible: "Showing All time.*"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: world-map-recenter
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${SHOTS}-return-restored
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    start: "25%,40%"
    end: "65%,55%"
    duration: 600
- extendedWaitUntil:
    visible:
      id: world-map-recenter
    timeout: 10000
- tapOn:
    id: world-map-recenter
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: world-map-recenter
    timeout: 10000
- assertNotVisible: ".*Failed to sync native client state.*"
- takeScreenshot: ${SHOTS}-recentered
