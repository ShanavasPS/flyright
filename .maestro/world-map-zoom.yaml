# World tab zoom: a double tap zooms the globe in about the tapped point and
# the recenter control appears once the camera leaves the fitted view;
# tapping it animates back to the fit and hides itself again.
#
# PRECONDITION: seeded journeys (recipe in world-map.yaml's header) — with an
# empty journal there is no fitted view to deviate from, so the recenter
# button never appears and the flow fails. Run with the dev build installed
# and `npx expo start` serving :8081.
#
# Run: maestro --device <device> test .maestro/world-map-zoom.yaml
appId: com.shanavasshaji.flyright
---
- launchApp
- openLink: "flyright://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "World"
    timeout: 90000
- openLink: "flyright://world"
- extendedWaitUntil:
    visible: "Everywhere you.ve been"
    timeout: 15000
# Two double taps = two zoom-in steps (pinch can't be synthesized by Maestro).
- doubleTapOn:
    point: "50%,40%"
- doubleTapOn:
    point: "50%,40%"
- extendedWaitUntil:
    visible: "Recenter the globe on your travels"
    timeout: 10000
- tapOn: "Recenter the globe on your travels"
- extendedWaitUntil:
    notVisible: "Recenter the globe on your travels"
    timeout: 10000
